AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: My Prayer Time — Alexa Prayer Times Skill (Hanafi, Apex NC)

# ─── GLOBALS ──────────────────────────────────────────────────────────────────
Globals:
  Function:
    Runtime:    nodejs20.x
    Timeout:    10
    MemorySize: 256
    Environment:
      Variables:
        PRAYER_CITY:     !Ref PrayerCity
        PRAYER_STATE:    !Ref PrayerState
        PRAYER_COUNTRY:  !Ref PrayerCountry
        PRAYER_METHOD:   !Ref PrayerMethod
        PRAYER_SCHOOL:   !Ref PrayerSchool
        PRAYER_TIMEZONE: !Ref PrayerTimezone
        SKILL_ID:        !Ref AlexaSkillId
        S3_BUCKET:       !Ref ContentBucket
        IQAMA_FAJR:      !Ref IqamaFajr
        IQAMA_DHUHR:     !Ref IqamaDhuhr
        IQAMA_ASR:       !Ref IqamaAsr
        IQAMA_MAGHRIB:   !Ref IqamaMaghrib
        IQAMA_ISHA:      !Ref IqamaIsha
        JUMUAH_1:        !Ref Jumuah1
        JUMUAH_2:        !Ref Jumuah2
        HOME_ADDRESS:         !Ref HomeAddress
        MOSQUE_ADDRESS:       !Ref MosqueAddress
        GOOGLE_MAPS_API_KEY:  !Ref GoogleMapsApiKey
        TRAVEL_TIME_FALLBACK: !Ref TravelTimeFallback

# ─── PARAMETERS ───────────────────────────────────────────────────────────────
Parameters:
  AlexaSkillId:
    Type:        String
    Description: Alexa Skill ID (from developer.amazon.com)

  PrayerCity:
    Type:    String
    Default: Apex
  PrayerState:
    Type:    String
    Default: NC
  PrayerCountry:
    Type:    String
    Default: US
  PrayerMethod:
    Type:    String
    Default: "2"
    Description: "AlAdhan calculation method — 2=ISNA (North America)"
  PrayerSchool:
    Type:    String
    Default: "1"
    Description: "Juristic school — 0=Shafi'i (earlier Asr), 1=Hanafi (later Asr) — MUST be 1"
  PrayerTimezone:
    Type:    String
    Default: America/New_York
  IqamaFajr:
    Type:    String
    Default: "06:30"
    Description: "Iqama time for Fajr (24hr format)"
  IqamaDhuhr:
    Type:    String
    Default: "13:30"
    Description: "Iqama time for Dhuhr (24hr format)"
  IqamaAsr:
    Type:    String
    Default: "17:30"
    Description: "Iqama time for Asr (24hr format)"
  IqamaMaghrib:
    Type:    String
    Default: "10"
    Description: "Minutes after Maghrib adhan for Iqama. OFFSET not clock time — Maghrib (sunset) changes every day"
  IqamaIsha:
    Type:    String
    Default: "21:15"
    Description: "Iqama time for Eaisha (24hr format)"
  Jumuah1:
    Type:    String
    Default: "12:15"
    Description: "Jumuah khutbah 1 time (24hr format)"
  Jumuah2:
    Type:    String
    Default: "13:30"
    Description: "Jumuah khutbah 2 time (24hr format)"
  HomeAddress:
    Type:    String
    Default: "Apex, NC"
    Description: "User home address for travel time calculation"
  MosqueAddress:
    Type:    String
    Default: "Apex Mosque, 733 Center St, Apex, NC 27502"
    Description: "Mosque address for travel time calculation"
  GoogleMapsApiKey:
    Type:    String
    Default: ""
    Description: "Google Maps Directions API key for traffic-based travel time"
  TravelTimeFallback:
    Type:    String
    Default: "12"
    Description: "Fallback travel time in minutes if Maps API unavailable"

# ─── RESOURCES ────────────────────────────────────────────────────────────────
Resources:

  # ── S3 Bucket for content.json and Adhan audio ──────────────────────────────
  # No BucketName — let CF generate one to avoid conflicts with pre-existing buckets.
  # Lambda reads the name via S3_BUCKET env var = !Ref ContentBucket (set below).
  ContentBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls:       true
        BlockPublicPolicy:     false   # must be false to attach the audio/* public-read policy
        IgnorePublicAcls:      true
        RestrictPublicBuckets: false   # must be false to serve objects via a public bucket policy

  # ── Public-read policy for audio/* only (required for Alexa SSML <audio> src) ────────
  # Alexa fetches the adhan MP3 directly — must be a public HTTPS URL.
  # Only audio/ is exposed; all other objects stay private.
  ContentBucketAudioPolicy:
    Type: AWS::S3::BucketPolicy
    DependsOn: ContentBucket
    Properties:
      Bucket: !Ref ContentBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowPublicReadAudio
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${ContentBucket.Arn}/audio/*"

  # ── Main Lambda Function ─────────────────────────────────────────────────────
  MyPrayerTimeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri:      ./lambda
      Handler:      index.handler
      Description:  "My Prayer Time — Alexa skill handler + prayer time refresh"
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ContentBucket
      Events:
        # Alexa Skill trigger
        AlexaSkillTrigger:
          Type: AlexaSkill
          Properties:
            SkillId: !Ref AlexaSkillId

        # Midnight cache reset (00:00 Eastern = 05:00 UTC)
        MidnightReset:
          Type: Schedule
          Properties:
            Description: "Clear prayer times cache at midnight Eastern"
            Schedule:    cron(0 5 * * ? *)
            Input:       '{"detail-type":"MyPrayerTimeMidnightReset"}'
            Enabled:     true

        # Prayer time EventBridge triggers
        # NOTE: These are placeholder fixed times.
        # In v2, these will be dynamically updated by Lambda after each fetch.
        # For Apex NC (Eastern) — approximate average times — adjust seasonally.

        FajrTrigger:
          Type: Schedule
          Properties:
            Description: "Fajr prayer time trigger — Apex NC (05:12 ET = 10:12 UTC)"
            Schedule:    cron(12 10 * * ? *)
            Input:       '{"detail-type":"MyPrayerTimePrayerTime","prayerName":"Fajr"}'
            Enabled:     true

        DhuhrTrigger:
          Type: Schedule
          Properties:
            Description: "Dhuhr prayer time trigger — Apex NC (12:31 ET = 17:31 UTC)"
            Schedule:    cron(31 17 * * ? *)
            Input:       '{"detail-type":"MyPrayerTimePrayerTime","prayerName":"Dhuhr"}'
            Enabled:     true

        AsrTrigger:
          Type: Schedule
          Properties:
            Description: "Asr prayer time trigger — Apex NC Hanafi (16:15 ET = 21:15 UTC)"
            Schedule:    cron(15 21 * * ? *)
            Input:       '{"detail-type":"MyPrayerTimePrayerTime","prayerName":"Asr"}'
            Enabled:     true

        MaghribTrigger:
          Type: Schedule
          Properties:
            Description: "Maghrib prayer time trigger — Apex NC (18:19 ET = 23:19 UTC)"
            Schedule:    cron(19 23 * * ? *)
            Input:       '{"detail-type":"MyPrayerTimePrayerTime","prayerName":"Maghrib"}'
            Enabled:     true

        IshaTrigger:
          Type: Schedule
          Properties:
            Description: "Isha prayer time trigger — Apex NC (19:45 ET = 00:45 UTC+1)"
            Schedule:    cron(45 0 * * ? *)
            Input:       '{"detail-type":"MyPrayerTimePrayerTime","prayerName":"Isha"}'
            Enabled:     true

# ─── OUTPUTS ──────────────────────────────────────────────────────────────────
Outputs:
  MyPrayerTimeFunctionArn:
    Description: Lambda function ARN
    Value:       !GetAtt MyPrayerTimeFunction.Arn
  ContentBucketName:
    Description: S3 bucket for content and audio
    Value:       !Ref ContentBucket
